#==============================================================================
# talentpath local load balancer  —  nginx (open source) on Windows
#
#   browser ──> nginx :8080 ──round robin──> :3000  instance-1
#                                        ──> :3001  instance-2
#                                        ──> :3003  instance-3
#
# Run with:
#   nginx.exe -p C:/nginx -c C:/nginx/conf/talentpath-lb.conf
#==============================================================================

worker_processes  auto;
error_log         logs/lb-error.log  warn;
pid               logs/lb-nginx.pid;

events {
    # Windows nginx uses select(); it cannot go as high as Linux epoll.
    worker_connections  1024;
}

http {
    # NOTE: mime.types is deliberately NOT included.
    # This server only reverse-proxies — it never serves a file from disk —
    # so the Content-Type always comes from the Next.js upstream.
    default_type  application/octet-stream;

    #--------------------------------------------------------------------------
    # Log format that PROVES round robin is working.
    # $upstream_addr = which backend actually served the request.
    #--------------------------------------------------------------------------
    log_format  lb  '$time_local  "$request"  status=$status  '
                    'upstream=$upstream_addr  '
                    'tried=$upstream_status  '
                    'lb_time=$request_time  backend_time=$upstream_response_time';

    access_log  logs/lb-access.log  lb;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    #--------------------------------------------------------------------------
    # THE UPSTREAM POOL
    #
    # Round robin is nginx's DEFAULT algorithm — there is no "round_robin"
    # directive to write. Requests go 3000 -> 3001 -> 3003 -> 3000 -> ...
    #
    # PASSIVE HEALTH CHECKS (this is the failover you asked for):
    #   max_fails=2      after 2 failed attempts...
    #   fail_timeout=10s ...mark this server down for 10 seconds, then
    #                    quietly try it again with one real request.
    #
    # IMPORTANT, and most tutorials get this wrong:
    # open-source nginx has NO active health checks. The `health_check`
    # directive is NGINX Plus (paid) only. Open-source nginx learns a server
    # is dead by *failing a real request to it* — which is why the
    # proxy_next_upstream block below matters so much: it re-sends that
    # failed request to a healthy server so the USER never sees the error.
    #--------------------------------------------------------------------------
    upstream talentpath_backends {
        server 127.0.0.1:3000  max_fails=2  fail_timeout=10s;   # instance-1
        server 127.0.0.1:3001  max_fails=2  fail_timeout=10s;   # instance-2
        server 127.0.0.1:3003  max_fails=2  fail_timeout=10s;   # instance-3

        # Reuse upstream TCP connections instead of a new handshake per request.
        # Needs proxy_http_version 1.1 + Connection "" below, or it silently
        # does nothing.
        keepalive  64;

        # --- alternatives, left here so you can see the trade-off ---
        # least_conn;   # send to the backend with fewest active requests
        # ip_hash;      # sticky: same client IP always hits the same backend
        #
        # We deliberately do NOT use ip_hash. Sticky sessions are the *other*
        # way to solve the "server forgot my login" problem, and they are the
        # worse way: they unbalance the pool, and when a backend dies every
        # user pinned to it is logged out. Shared state in Redis (see
        # src/lib/session-store.ts) solves it properly and keeps the pool
        # evenly balanced. That contrast is the whole point of this exercise.
    }

    server {
        listen       8080;
        server_name  localhost;

        # Next.js can stream large RSC payloads; don't buffer them to disk.
        proxy_buffering      off;
        client_max_body_size 10m;

        #----------------------------------------------------------------------
        # nginx's OWN health endpoint. Answers even if all 3 backends are dead,
        # so you can tell "load balancer down" apart from "backends down".
        #----------------------------------------------------------------------
        location = /lb-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx load balancer: up\n";
        }

        location / {
            proxy_pass  http://talentpath_backends;

            # Required for upstream keepalive to actually work.
            proxy_http_version  1.1;
            proxy_set_header    Connection  "";

            #------------------------------------------------------------------
            # Forwarded headers.
            # Auth.js (NextAuth v5) builds OAuth callback URLs from these. Get
            # them wrong and Google sign-in redirects to the wrong origin.
            # AUTH_TRUST_HOST=true in .env is what makes Auth.js trust them.
            #------------------------------------------------------------------
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host   $host;
            proxy_set_header  X-Forwarded-Port   8080;

            #------------------------------------------------------------------
            # FAILOVER. If a backend refuses the connection, times out, or
            # returns 502/503/504, retry the SAME request on the next server
            # in the ring. With 3 backends and tries=3, a request only fails
            # if all three are down.
            #
            # non_idempotent also retries POST/PATCH. Enabled here because this
            # is a learning lab; in production think hard first — a retried
            # POST can double-charge a card or create two records.
            #------------------------------------------------------------------
            proxy_next_upstream          error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries    3;
            proxy_next_upstream_timeout  15s;

            # Fail fast on a dead port so failover is instant, not a 75s hang.
            proxy_connect_timeout  2s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            #------------------------------------------------------------------
            # Debug headers — open DevTools > Network and watch these rotate
            # 3000 -> 3001 -> 3003. This is your visual proof of round robin.
            #------------------------------------------------------------------
            add_header  X-Served-By     $upstream_addr          always;
            add_header  X-Backend-Time  $upstream_response_time always;
            add_header  X-LB-Status     $upstream_status        always;
        }
    }
}
